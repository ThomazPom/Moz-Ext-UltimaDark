name: Apply document.write patch

on:
  push:
    branches:
      - feature/document-write-dom-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-write-dom-pipeline

      - name: Patch background.js
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('background.js')
          src = path.read_text(encoding='utf-8')

          transform_methods = r'''
            createInclusiveDOMQueryScope(root) {
              if (!root || typeof root.querySelectorAll !== "function") {
                return false;
              }

              return {
                querySelectorAll(selector) {
                  const nodes = [...root.querySelectorAll(selector)];

                  if (
                    root instanceof Element &&
                    typeof root.matches === "function" &&
                    root.matches(selector)
                  ) {
                    nodes.unshift(root);
                  }

                  return nodes;
                }
              };
            }

            transformDOMSubtree(root, details, options = {}) {
              if (!root || typeof root.querySelectorAll !== "function") {
                return;
              }

              if (root instanceof SVGElement) {
                uDark.frontEditSVG(root, details);
                return;
              }

              const scope = uDark.createInclusiveDOMQueryScope(root);
              if (!scope) {
                return;
              }

              const svgElements = uDark.processSvgElements(scope, details);

              uDark.edit_styles_attributes(scope, details, options);
              uDark.edit_styles_elements(
                scope,
                details,
                "ud-edited-background",
                options
              );

              uDark.processLinks(scope);
              uDark.processImages(scope);
              uDark.processIframes(scope, details, options);
              uDark.processColoredItems(scope);
              uDark.restoreSvgElements(svgElements);
              uDark.restoreIntegrityAttributes(scope);
            }

            installDocumentWriteEngine() {
              const P = Document.prototype;

              const originalOpen = P.open;
              const originalWrite = P.write;
              const originalWriteln = P.writeln;
              const originalClose = P.close;

              const documentStates = new WeakMap();

              const createState = () => ({
                editedSubtrees: new WeakSet(),
                processing: false,
                closed: false
              });

              function getState(doc) {
                let state = documentStates.get(doc);

                if (!state) {
                  state = createState();
                  documentStates.set(doc, state);
                }

                return state;
              }

              function resetState(doc) {
                documentStates.set(doc, createState());
              }

              function frontEditDOMSubtree(root, state) {
                if (!(root instanceof Element)) {
                  return;
                }

                if (state.editedSubtrees.has(root)) {
                  return;
                }

                try {
                  uDark.transformDOMSubtree(root, undefined, {
                    fromDocumentWrite: true
                  });

                  state.editedSubtrees.add(root);
                } catch (error) {
                  console.error(
                    "[UltimaDark document.write] Subtree edit failed",
                    root,
                    error
                  );
                }
              }

              function processStableBranches(root, state) {
                let parent = root;

                while (parent instanceof Element) {
                  const children = parent.children;
                  const count = children.length;

                  if (count === 0) {
                    return;
                  }

                  for (let i = 0; i < count - 1; i++) {
                    frontEditDOMSubtree(children[i], state);
                  }

                  parent = children[count - 1];
                }
              }

              function processWrittenDocument(doc, final = false) {
                const state = getState(doc);

                if (state.processing) {
                  return;
                }

                state.processing = true;

                try {
                  if (final) {
                    if (doc.head) {
                      for (const child of [...doc.head.children]) {
                        frontEditDOMSubtree(child, state);
                      }
                    }

                    if (doc.body) {
                      for (const child of [...doc.body.children]) {
                        frontEditDOMSubtree(child, state);
                      }
                    }

                    state.closed = true;
                    return;
                  }

                  if (doc.head) {
                    processStableBranches(doc.head, state);
                  }

                  if (doc.body) {
                    processStableBranches(doc.body, state);
                  }
                } finally {
                  state.processing = false;
                }
              }

              Object.defineProperty(P, "open", {
                configurable: true,
                writable: true,
                value: function open(...args) {
                  const result = originalOpen.apply(this, args);
                  resetState(this);
                  return result;
                }
              });

              Object.defineProperty(P, "write", {
                configurable: true,
                writable: true,
                value: function write(...args) {
                  const result = originalWrite.apply(this, args);
                  processWrittenDocument(this, false);
                  return result;
                }
              });

              Object.defineProperty(P, "writeln", {
                configurable: true,
                writable: true,
                value: function writeln(...args) {
                  const result = originalWriteln.apply(this, args);
                  processWrittenDocument(this, false);
                  return result;
                }
              });

              Object.defineProperty(P, "close", {
                configurable: true,
                writable: true,
                value: function close(...args) {
                  const result = originalClose.apply(this, args);
                  processWrittenDocument(this, true);
                  return result;
                }
              });

              uDark.log("document.write support installed");
            }

          '''

          marker = '  frontEditHTML(elem, strO, details, options = {}) {'
          if 'transformDOMSubtree(root, details' not in src:
              if marker not in src:
                  raise SystemExit('frontEditHTML marker not found')
              src = src.replace(marker, transform_methods + marker, 1)

          backend_pattern = re.compile(
              r'(?P<i>[ \t]+)// 4\. Temporarily replace all SVG elements.*?'
              r'(?P=i)uDark\.restoreSvgElements\(svgElements\);',
              re.S,
          )
          src, count = backend_pattern.subn(
              r'\g<i>// Shared steps 4, 5, 8, 9, 10, 11, 13 and 15.\n'
              r'\g<i>uDark.transformDOMSubtree(aDocument, details, {});',
              src,
              count=1,
          )
          if count != 1:
              raise SystemExit('backend pipeline not found')

          src, count = re.subn(
              r'[ \t]*// 15\. Remove the integrity attribute.*?\n'
              r'[ \t]*uDark\.restoreIntegrityAttributes\(aDocument\);\s*\n',
              '',
              src,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('backend integrity step not found')

          front_start = src.index('  frontEditHTML(elem, strO, details, options = {}) {')
          front_end = src.index('  createDocumentFromHtml(', front_start)
          front = src[front_start:front_end]
          front_pattern = re.compile(
              r'(?P<i>[ \t]+)// 4\. Temporarily replace all SVG elements.*?'
              r'(?P=i)uDark\.restoreIntegrityAttributes\(aDocument\);',
              re.S,
          )
          front, count = front_pattern.subn(
              r'\g<i>// Shared steps 4, 5, 8, 9, 10, 11, 13 and 15.\n'
              r'\g<i>uDark.transformDOMSubtree(aDocument, details, options);',
              front,
              count=1,
          )
          if count != 1:
              raise SystemExit('frontEditHTML pipeline not found')
          src = src[:front_start] + front + src[front_end:]

          bootstrap = '  AllLevels.install();\n'
          install_call = '  uDark.installDocumentWriteEngine();\n'
          if install_call not in src:
              if bootstrap not in src:
                  raise SystemExit('bootstrap marker not found')
              src = src.replace(bootstrap, bootstrap + install_call, 1)

          path.write_text(src, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check background.js

      - name: Commit generated change and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-document-write-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js .github/workflows/apply-document-write-patch.yml
          git commit -m "Support streamed document.write DOM transformations"
          git push origin HEAD:feature/document-write-dom-pipeline
